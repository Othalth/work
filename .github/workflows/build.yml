name: build
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Build the mod
        run: |
          chmod +x ./gradlew
          ./gradlew build

      - name: Save the mod file
        uses: actions/upload-artifact@v4
        with:
          name: o-tablet-dp
          path: build/libs/*.jar
